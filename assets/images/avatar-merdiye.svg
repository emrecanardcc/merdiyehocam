<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="avatarBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF" />
      <stop offset="50%" stop-color="#EDE9FE" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Circle with Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarBgGrad)" />
  <circle cx="200" cy="200" r="186" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-dasharray="12 6" opacity="0.9" />

  <!-- Math Equations in Background -->
  <text x="50" y="90" font-family="'Courier New', monospace" font-size="16" fill="#7C3AED" opacity="0.45">EBOB(a,b)·EKOK(a,b)=a·b</text>
  <text x="240" y="80" font-family="'Courier New', monospace" font-size="16" fill="#9333EA" opacity="0.45">a² + b² = c²</text>
  <text x="45" y="320" font-family="'Courier New', monospace" font-size="15" fill="#D97706" opacity="0.5">r/l = α/360°</text>
  <text x="260" y="330" font-family="'Courier New', monospace" font-size="16" fill="#6D28D9" opacity="0.45">y = mx + b</text>

  <!-- Digital Slate in Center -->
  <rect x="70" y="115" width="260" height="175" rx="18" fill="url(#boardGrad)" stroke="#C4B5FD" stroke-width="2" filter="url(#cardShadow)" />
  <rect x="80" y="125" width="240" height="155" rx="12" fill="#2E1065" opacity="0.75" />

  <!-- Formula on Board -->
  <text x="200" y="160" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#FDE047">
    LGS MATEMATİK 20'DE 20
  </text>
  <text x="200" y="190" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#DDD6FE">
    √256 = 16 &bull; (a+b)² = a²+2ab+b²
  </text>
  <text x="200" y="218" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#C4B5FD">
    Yeni Nesil Soru Taktikleri &amp; Föyler
  </text>
  <rect x="120" y="235" width="160" height="28" rx="14" fill="#F59E0B" />
  <text x="200" y="254" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#1E1B4B">
    MERDİYE HOCA İLE BAŞAR
  </text>

  <!-- Stylus Pen Element -->
  <g transform="translate(290, 240) rotate(-35)">
    <rect x="-6" y="-30" width="12" height="60" rx="3" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5" />
    <polygon points="-6,30 6,30 0,44" fill="#8B5CF6" />
    <circle cx="0" cy="44" r="2" fill="#6D28D9" />
  </g>

  <!-- Gold Star Badges -->
  <g transform="translate(195, 30)">
    <polygon points="5,0 7,6 13,6 8,10 10,16 5,12 0,16 2,10 -3,6 3,6" fill="#F59E0B" />
  </g>
</svg>

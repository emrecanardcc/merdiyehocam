<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Circle with Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="186" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-dasharray="12 6" opacity="0.85" />

  <!-- Math Equations in Background -->
  <text x="50" y="90" font-family="'Courier New', monospace" font-size="16" fill="#38BDF8" opacity="0.35">EBOB(a,b)·EKOK(a,b)=a·b</text>
  <text x="240" y="80" font-family="'Courier New', monospace" font-size="16" fill="#F472B6" opacity="0.4">a² + b² = c²</text>
  <text x="45" y="320" font-family="'Courier New', monospace" font-size="15" fill="#FBBF24" opacity="0.35">r/l = α/360°</text>
  <text x="260" y="330" font-family="'Courier New', monospace" font-size="16" fill="#34D481" opacity="0.4">y = mx + b</text>

  <!-- Blackboard / Digital Screen in Center -->
  <rect x="70" y="115" width="260" height="175" rx="14" fill="url(#boardGrad)" stroke="#10B981" stroke-width="2" filter="url(#cardShadow)" />
  <rect x="80" y="125" width="240" height="155" rx="8" fill="#022C22" opacity="0.6" />

  <!-- Formula on Board -->
  <text x="200" y="160" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="18" fill="#FDE047">
    LGS MATEMATİK 20'DE 20
  </text>
  <text x="200" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#A7F3D0">
    √256 = 16 &bull; (a+b)² = a²+2ab+b²
  </text>
  <text x="200" y="218" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#93C5FD">
    Yeni Nesil Soru Taktikleri & Föyler
  </text>
  <rect x="120" y="235" width="160" height="28" rx="14" fill="#F59E0B" />
  <text x="200" y="254" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="12" fill="#1E1B4B">
    MERDİYE HOCA İLE BAŞAR
  </text>

  <!-- Stylus Pen Element -->
  <g transform="translate(290, 240) rotate(-35)">
    <rect x="-6" y="-30" width="12" height="60" rx="3" fill="#E2E8F0" stroke="#475569" stroke-width="1.5" />
    <polygon points="-6,30 6,30 0,44" fill="#38BDF8" />
    <circle cx="0" cy="44" r="2" fill="#0284C7" />
  </g>

  <!-- Gold Star Badges -->
  <g transform="translate(195, 30)">
    <polygon points="5,0 7,6 13,6 8,10 10,16 5,12 0,16 2,10 -3,6 3,6" fill="#F59E0B" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" width="360" height="84">
  <defs>
    <!-- Lila & Violet Luxury Gradients -->
    <linearGradient id="mhIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9061F9" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>

    <linearGradient id="mhMonogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F3FF" />
    </linearGradient>

    <linearGradient id="goldSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="textVioletGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="lilaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== MH ICON CONTAINER ==================== -->
  <g transform="translate(10, 8)">
    <!-- Soft Outer Shadow/Glow -->
    <rect x="0" y="0" width="68" height="68" rx="20" fill="#7C3AED" opacity="0.25" filter="url(#lilaGlow)" />
    <!-- Gradient Background -->
    <rect x="0" y="0" width="68" height="68" rx="20" fill="url(#mhIconGrad)" stroke="#DDD6FE" stroke-width="1.8" />

    <!-- Subtle Geometric Math Orbit in Icon -->
    <circle cx="34" cy="34" r="26" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.2" stroke-dasharray="3,3" />

    <!-- ==================== MH MONOGRAM ==================== -->
    <!-- 'M' Left Wing & Center V-Apex -->
    <path d="M 18 51 L 18 20 L 29 36 L 38 24 L 38 51" 
          fill="none" 
          stroke="url(#mhMonogramGrad)" 
          stroke-width="3.8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 'H' Right Wing -->
    <path d="M 50 20 L 50 51" 
          fill="none" 
          stroke="url(#mhMonogramGrad)" 
          stroke-width="3.8" 
          stroke-linecap="round" />

    <!-- Intertwined Math Infinity Bridge linking M and H -->
    <path d="M 32 35 C 37 29, 41 41, 50 35" 
          fill="none" 
          stroke="url(#goldSparkle)" 
          stroke-width="3" 
          stroke-linecap="round" />

    <!-- Mathematical Accent Node -->
    <circle cx="35" cy="35" r="2.4" fill="url(#goldSparkle)" />

    <!-- Golden Square Root Accent -->
    <path d="M 13 44 L 16 49 L 20 40" 
          fill="none" 
          stroke="#FCD34D" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Sparkle Node (Top Right) -->
    <circle cx="53" cy="17" r="2.2" fill="url(#goldSparkle)" />
  </g>

  <!-- ==================== BRAND TYPOGRAPHY ==================== -->
  <g transform="translate(94, 40)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="28" 
          fill="#1E1B4B" 
          letter-spacing="-0.5">
      Merdiye<tspan fill="url(#textVioletGrad)">Hocam</tspan>
    </text>
  </g>

  <!-- ==================== SUBTITLE BADGE ==================== -->
  <g transform="translate(94, 52)">
    <rect x="0" y="0" width="190" height="22" rx="7" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.2" />
    <circle cx="11" cy="11" r="3.2" fill="#7C3AED" />
    <text x="22" y="15" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="10.5" 
          fill="#6D28D9" 
          letter-spacing="0.8">
      LGS MATEMATİK AKADEMİSİ
    </text>
  </g>
</svg>

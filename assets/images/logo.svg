<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Container -->
  <rect x="8" y="10" width="60" height="60" rx="16" fill="url(#logoGrad)" />
  
  <!-- Math Formula Graphic (Root & Pi & Sigma) -->
  <path d="M 22 46 L 27 46 L 33 55 L 42 25 L 56 25" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="48" cy="38" r="3.5" fill="url(#goldGrad)" />
  <text x="35" y="47" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">M</text>

  <!-- Brand Text -->
  <text x="80" y="38" font-family="'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="-0.5">
    Merdiye<tspan fill="#38BDF8">Hocam</tspan>
  </text>
  
  <!-- Subtitle Badge -->
  <rect x="80" y="47" width="138" height="20" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="88" y="61" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#FBBF24" letter-spacing="1">
    LGS MATEMATİK AKADEMİSİ
  </text>
</svg>

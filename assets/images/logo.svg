<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <!-- Lila & Violet Gradients -->
    <linearGradient id="mhIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <linearGradient id="mhMonogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F3FF" />
    </linearGradient>

    <linearGradient id="goldSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="textVioletGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="lilaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== MH ICON CONTAINER ==================== -->
  <g transform="translate(8, 9)">
    <!-- Soft Outer Shadow/Glow -->
    <rect x="0" y="0" width="62" height="62" rx="18" fill="#7C3AED" opacity="0.22" filter="url(#lilaGlow)" />
    <!-- Gradient Background -->
    <rect x="0" y="0" width="62" height="62" rx="18" fill="url(#mhIconGrad)" stroke="#C4B5FD" stroke-width="1.5" />

    <!-- Subtle Geometric Math Grid in Icon -->
    <circle cx="31" cy="31" r="23" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" stroke-dasharray="2,3" />

    <!-- ==================== MH LUXURY MONOGRAM ==================== -->
    <!-- 'M' Left Wing & Center V-Apex -->
    <path d="M 16 46 L 16 19 L 26 33 L 34 22 L 34 46" 
          fill="none" 
          stroke="url(#mhMonogramGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 'H' Right Wing -->
    <path d="M 46 19 L 46 46" 
          fill="none" 
          stroke="url(#mhMonogramGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round" />

    <!-- Intertwined Math Symbol Crossbar: Integral & Infinity bridge linking M and H -->
    <path d="M 28 32 C 32 27, 36 37, 46 32" 
          fill="none" 
          stroke="#FDE047" 
          stroke-width="2.5" 
          stroke-linecap="round" />

    <!-- Mathematical Infinity Accent Node (Left loop of crossbar) -->
    <circle cx="30" cy="32" r="2.2" fill="url(#goldSparkle)" />

    <!-- Mathematical Square Root & Integral Curve Accent -->
    <path d="M 12 40 L 15 44 L 18 36" 
          fill="none" 
          stroke="#FCD34D" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Golden Ratio Sparkle Star (Top Right) -->
    <circle cx="48" cy="16" r="2" fill="url(#goldSparkle)" />
  </g>

  <!-- ==================== BRAND TYPOGRAPHY ==================== -->
  <g transform="translate(84, 38)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="25" 
          fill="#1E1B4B" 
          letter-spacing="-0.5">
      Merdiye<tspan fill="url(#textVioletGrad)">Hocam</tspan>
    </text>
  </g>

  <!-- ==================== SUBTITLE BADGE ==================== -->
  <g transform="translate(84, 48)">
    <rect x="0" y="0" width="176" height="20" rx="7" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
    <circle cx="10" cy="10" r="3" fill="#8B5CF6" />
    <text x="20" y="14" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="700" 
          font-size="9.5" 
          fill="#6D28D9" 
          letter-spacing="0.8">
      LGS MATEMATİK AKADEMİSİ
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <linearGradient id="goldNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Glow -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="#7C3AED" opacity="0.25" filter="url(#iconGlow)" />
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#iconBgGrad)" stroke="#DDD6FE" stroke-width="2" />

  <!-- Math Geometry Circles -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2" stroke-dasharray="3,4" />
  <circle cx="50" cy="50" r="22" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- ==================== MH MONOGRAM ==================== -->
  <!-- 'M' Wings & Apex -->
  <path d="M 26 71 L 26 29 L 41 51 L 53 34 L 53 71" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 'H' Right Wing -->
  <path d="M 72 29 L 72 71" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5.5" 
        stroke-linecap="round" />

  <!-- Mathematical Infinity / Integral Crossbar Bridge linking M and H -->
  <path d="M 44 50 C 50 43, 56 57, 72 50" 
        fill="none" 
        stroke="url(#goldNode)" 
        stroke-width="4" 
        stroke-linecap="round" />

  <!-- Math Golden Ratio Node -->
  <circle cx="47" cy="50" r="3.2" fill="url(#goldNode)" />

  <!-- Square Root Radical Accent -->
  <path d="M 18 62 L 23 68 L 28 56" 
        fill="none" 
        stroke="url(#goldNode)" 
        stroke-width="2.8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Sparkle Star -->
  <circle cx="75" cy="24" r="2.8" fill="url(#goldNode)" />
</svg>

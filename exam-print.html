<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LGS Matematik Kazanım Sınavı | Merdiye Hocam</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo-icon.svg">
  <style>
    /* ==========================================================================
       Merdiye Hocam - Standart A4 Öğretmen Sınav & Çalışma Kağıdı Baskı Sayfası
       Saf A4 Tasarım, Sıfır Fazlalık, Kusursuz İki Sütunlu Sayfa Düzeni
       ========================================================================== */

    @page {
      size: A4 portrait;
      margin: 10mm 12mm 12mm 12mm;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: #F1F5F9;
      color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 10pt;
      line-height: 1.45;
      overflow-x: hidden;
    }

    /* Üst Sabit İşlem Çubuğu (Sadece Ekranda Görünür, Yazdırmada Gizlenir) */
    .print-control-bar {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      background: #1E1B4B;
      color: #FFFFFF;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      z-index: 1000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }

    .print-control-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.88rem;
    }

    .print-badge {
      background: #7C3AED;
      color: #FFFFFF;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .print-control-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 18px;
      font-size: 0.86rem;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-action-primary {
      background: #7C3AED;
      color: #FFFFFF;
    }

    .btn-action-primary:hover {
      background: #6D28D9;
      transform: translateY(-1px);
    }

    .btn-action-secondary {
      background: #334155;
      color: #F8FAFC;
    }

    .btn-action-secondary:hover {
      background: #475569;
    }

    /* A4 Kağıt Taşıyıcı Konteyner */
    .exam-paper-container {
      max-width: 820px;
      margin: 24px auto;
      background: #FFFFFF;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
      border-radius: 4px;
      padding: 24px 28px;
      min-height: 1000px;
    }

    /* Yazdırma Modu */
    @media print {
      body {
        background: #FFFFFF !important;
        color: #000000 !important;
        font-size: 10pt !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .no-print,
      .print-control-bar {
        display: none !important;
      }

      .exam-paper-container {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        background: transparent !important;
        min-height: auto !important;
      }

      .exam-sheet-root {
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
      }

      .exam-page-break {
        page-break-before: always !important;
        break-before: page !important;
        margin-top: 0 !important;
        border: none !important;
        height: 0 !important;
      }

      .exam-question-item,
      .teacher-sol-item {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }

    /* Sınav Başlığı Kutusu */
    .exam-sheet-root {
      width: 100%;
    }

    .exam-header-box {
      border: 2px solid #1E1B4B;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      background: #FAF8FE;
    }

    .exam-header-top {
      text-align: center;
      margin-bottom: 6px;
    }

    .exam-logo-text {
      font-size: 8pt;
      font-weight: 800;
      color: #7C3AED;
      letter-spacing: 1px;
      display: block;
    }

    .exam-school-name {
      font-size: 11pt;
      font-weight: 900;
      color: #1E1B4B;
      text-transform: uppercase;
      margin: 2px 0;
    }

    .exam-main-title {
      font-size: 10pt;
      font-weight: 800;
      color: #4338CA;
      border-bottom: 1.5px solid #DDD6FE;
      padding-bottom: 4px;
    }

    .exam-student-info-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 6px 12px;
      font-size: 8.5pt;
      padding: 6px 0;
      border-bottom: 1px dashed #CBD5E1;
    }

    .exam-info-cell {
      color: #334155;
    }

    .exam-grade-cell {
      font-size: 9pt;
      font-weight: 800;
      color: #7C3AED;
    }

    .exam-instructions-line {
      font-size: 7.5pt;
      color: #64748B;
      font-style: italic;
      margin-top: 4px;
      text-align: center;
    }

    /* İki Sütunlu Sayfa Düzeni */
    .exam-questions-container.two-column-layout {
      columns: 2;
      column-gap: 22px;
      column-rule: 1px dashed #CBD5E1;
      width: 100%;
    }

    .exam-questions-container.single-column-layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .exam-question-item {
      break-inside: avoid !important;
      page-break-inside: avoid !important;
      display: inline-block;
      width: 100%;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px dotted #E2E8F0;
    }

    .exam-question-item:last-child {
      border-bottom: none;
    }

    .exam-question-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }

    .exam-q-num {
      background: #1E1B4B;
      color: #FFFFFF;
      font-weight: 900;
      font-size: 8pt;
      padding: 2px 7px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .exam-q-unit-tag {
      font-size: 7pt;
      color: #64748B;
      font-weight: 700;
      text-transform: uppercase;
    }

    .exam-q-text {
      font-size: 9.5pt;
      color: #0F172A;
      line-height: 1.45;
      margin-bottom: 8px;
      text-align: justify;
    }

    .exam-q-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 8px;
      margin-bottom: 8px;
      font-size: 8.5pt;
    }

    .exam-q-opt {
      display: flex;
      gap: 4px;
      align-items: baseline;
    }

    .exam-opt-lbl {
      font-weight: 800;
      color: #1E1B4B;
    }

    .exam-opt-txt {
      color: #1E293B;
    }

    .exam-scratch-area {
      border: 1px dashed #CBD5E1;
      background: #F8FAFC;
      border-radius: 4px;
      height: 60px;
      position: relative;
      margin-top: 4px;
    }

    .exam-scratch-lbl {
      position: absolute;
      top: 3px;
      right: 6px;
      font-size: 6.5pt;
      color: #94A3B8;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* Öğretmen Cevap Anahtarı Sayfası */
    .exam-teacher-key-sheet {
      page-break-before: always !important;
      break-before: page !important;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 2px solid #7C3AED;
    }

    .exam-teacher-key-header {
      text-align: center;
      margin-bottom: 12px;
    }

    .exam-teacher-key-header h3 {
      font-size: 11pt;
      font-weight: 900;
      color: #7C3AED;
    }

    .exam-teacher-key-header p {
      font-size: 8pt;
      color: #64748B;
      font-weight: 700;
    }

    .exam-matrix-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 14px;
      font-size: 8pt;
      text-align: center;
    }

    .exam-matrix-table th,
    .exam-matrix-table td {
      border: 1px solid #CBD5E1;
      padding: 4px 6px;
    }

    .exam-matrix-table th {
      background: #F1F5F9;
      font-weight: 800;
      color: #1E1B4B;
    }

    .exam-matrix-table td b {
      color: #7C3AED;
      font-weight: 900;
    }

    .teacher-sol-item {
      break-inside: avoid !important;
      page-break-inside: avoid !important;
      margin-bottom: 10px;
      padding: 8px 10px;
      background: #FAF8FE;
      border-left: 3px solid #7C3AED;
      border-radius: 4px;
      font-size: 8pt;
    }

    .teacher-sol-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .teacher-sol-ans {
      color: #7C3AED;
      font-weight: 800;
    }

    .teacher-sol-explanation {
      color: #334155;
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .teacher-sol-tactic {
      color: #B45309;
      font-size: 7.5pt;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Sabit Üst Çubuk (Baskıda Gizlenir) -->
  <div class="print-control-bar no-print">
    <div class="print-control-info">
      <span class="print-badge">Standart A4 Baskı</span>
      <span id="printSheetSummary">Sınav Kağıdı Hazır</span>
    </div>
    <div class="print-control-actions">
      <button type="button" class="btn-action btn-action-primary" id="startPrintBtn" onclick="window.print()">
        Yazdır / PDF Olarak Kaydet (A4)
      </button>
      <button type="button" class="btn-action btn-action-secondary" onclick="window.close()">
        Kapat
      </button>
    </div>
  </div>

  <!-- A4 Sınav Sayfası -->
  <main class="exam-paper-container">
    <div id="examContainerRoot">
      <!-- Veri yüklendiğinde doldurulur -->
      <div style="padding: 60px 20px; text-align: center; color: #64748B;">
        <b>Sınav kağıdı yükleniyor...</b>
      </div>
    </div>
  </main>

  <script>
    (function () {
      function loadAndRenderExam() {
        const root = document.getElementById("examContainerRoot");
        const summary = document.getElementById("printSheetSummary");

        try {
          const raw = localStorage.getItem("merdiye_exam_print_data") || sessionStorage.getItem("merdiye_exam_print_data");
          if (!raw) {
            if (root.querySelector(".exam-sheet-root")) {
              return;
            }
            root.innerHTML = `
              <div style="padding: 60px 20px; text-align: center; color: #64748B;">
                <h3 style="color: #1E1B4B; margin-bottom: 8px;">Yazdırılacak Sınav Kağıdı Bulunamadı</h3>
                <p>Lütfen önce yönetim panelinden soruları üretin ve ardından 'A4 Sınav Kağıdı Yazdır' butonuna tıklayın.</p>
                <div style="margin-top: 16px;">
                  <a href="admin.html" class="btn-action btn-action-primary">Yönetim Paneline Dön</a>
                </div>
              </div>
            `;
            return;
          }

          const parsed = JSON.parse(raw);
          if (parsed.title) {
            document.title = parsed.title;
          }
          if (parsed.html) {
            root.innerHTML = parsed.html;
          }
          if (summary && parsed.questionCount) {
            summary.textContent = parsed.questionCount + " Soru - " + (parsed.title || "A4 Sınav Kağıdı");
          }

          // Otomatik yazdırma penceresini aç (Eğer URL'de autoprint varsa veya ilk yüklemede)
          const urlParams = new URLSearchParams(window.location.search);
          if (urlParams.get("autoprint") === "1" || urlParams.get("autoprint") === "true") {
            setTimeout(function () {
              window.focus();
              window.print();
            }, 300);
          }
        } catch (err) {
          console.error("Sınav kağıdı yüklenirken hata:", err);
          root.innerHTML = `<div style="padding: 40px; text-align: center; color: #EF4444;">Sınav kağıdı oluşturulurken hata oluştu: ` + String(err.message || err) + `</div>`;
        }
      }

      window.addEventListener("DOMContentLoaded", loadAndRenderExam);
    })();
  </script>
</body>
</html>
